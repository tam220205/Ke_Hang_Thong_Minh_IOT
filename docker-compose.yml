version: '3.8'

services:
  # Optional local broker for manual development. The app defaults to HiveMQ;
  # starting this profile alone does not repoint the firmware/dashboard/flows.
  mosquitto:
    profiles: [local-broker]
    image: eclipse-mosquitto:2
    container_name: smartshelf_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - smartshelf_net

  # Node-RED uses the same HiveMQ public broker as the ESP32 and dashboard.
  nodered:
    image: nodered/node-red:latest
    container_name: smartshelf_nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_IDS=${TELEGRAM_CHAT_IDS:-}
    volumes:
      - ./docker/nodered/data:/data
    networks:
      - smartshelf_net

  # 3. Web Dashboard Nginx (Giao diện Tiệm Tạp Hóa 4.0 - 10 Kệ Hàng)
  dashboard:
    image: nginx:alpine
    container_name: smartshelf_dashboard
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    networks:
      - smartshelf_net

networks:
  smartshelf_net:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
