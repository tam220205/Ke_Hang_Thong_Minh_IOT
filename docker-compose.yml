version: '3.8'

# Chạy "python tools/setup_security.py" trước lần đầu để tạo .env, tệp mật khẩu
# Mosquitto và .htpasswd cho dashboard (OWASP IoT I1-I3).

services:
  # Broker nội bộ có xác thực + ACL (hồ sơ local-broker). Bật bằng:
  #   docker compose --profile local-broker up -d
  # rồi đặt MQTT_HOST=mosquitto, MQTT_PORT=1883 trong .env cho Node-RED (bỏ TLS ở node broker).
  mosquitto:
    profiles: [local-broker]
    image: eclipse-mosquitto:2
    container_name: smartshelf_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - smartshelf_net

  # Node-RED: editor/API bắt buộc đăng nhập; xác minh chữ ký telemetry và ký lệnh downlink.
  nodered:
    image: nodered/node-red:4.1
    container_name: smartshelf_nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_IDS=${TELEGRAM_CHAT_IDS:-}
      - MQTT_HOST=${MQTT_HOST:-broker.hivemq.com}
      - MQTT_PORT=${MQTT_PORT:-8883}
      - SHELF_HMAC_KEY=${SHELF_HMAC_KEY:?Chua dat SHELF_HMAC_KEY trong .env - chay python tools/setup_security.py}
      - NODERED_ADMIN_USER=${NODERED_ADMIN_USER:-admin}
      - NODERED_ADMIN_PASSWORD_HASH=${NODERED_ADMIN_PASSWORD_HASH:?Chua dat NODERED_ADMIN_PASSWORD_HASH trong .env}
      - NODERED_CREDENTIAL_SECRET=${NODERED_CREDENTIAL_SECRET:-}
    volumes:
      - ./docker/nodered/data:/data
    networks:
      - smartshelf_net

  # Web dashboard qua Nginx: HTTP Basic Auth + header bảo mật (CSP, chống nhúng khung).
  dashboard:
    image: nginx:alpine
    container_name: smartshelf_dashboard
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/auth:/etc/nginx/auth:ro
    networks:
      - smartshelf_net

networks:
  smartshelf_net:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
