# Broker nội bộ (hồ sơ local-broker). OWASP I1/I2: không cho kết nối ẩn danh,
# mỗi thành phần có tài khoản riêng và chỉ được đọc/ghi đúng chủ đề của mình (ACL).
# Tạo tệp mật khẩu: python tools/setup_security.py (hoặc xem README, mục Bảo mật).
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 1883
protocol mqtt

listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
