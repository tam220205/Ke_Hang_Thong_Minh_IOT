# Web dashboard (OWASP I3): bắt buộc đăng nhập HTTP Basic và thêm các header bảo mật.
# Tệp mật khẩu docker/nginx/.htpasswd do tools/setup_security.py tạo (không commit).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    auth_basic "Smart Shelf Dashboard";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # 'unsafe-inline' cho script vẫn cần vì giao diện dùng onclick trong HTML;
    # nguồn script ngoài và nơi được kết nối thì bị giới hạn.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' wss: ws://localhost:9001 ws://127.0.0.1:9001; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
